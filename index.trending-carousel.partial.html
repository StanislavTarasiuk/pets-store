<section class="trending-carousel" id="best-sellers">
  <div class="trending-carousel__container">
    <header class="trending-carousel__header">
      <h2 class="trending-carousel__title">Trending Products</h2>
      <div class="trending-carousel__icon">
        <svg
          class="trending-carousel__bone-icon"
          width="209"
          height="90"
          viewBox="0 0 209 90"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </div>
      <p class="trending-carousel__subtitle">
        Top-selling items and popular picks by our customers. Check them now!
      </p>
    </header>

    <div class="trending-carousel__carousel-wrapper">
      <button
        class="trending-carousel__nav trending-carousel__nav--prev"
        type="button"
        aria-label="Previous products"
      >
        <svg
          class="trending-carousel__nav-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </button>

      <div class="trending-carousel__carousel">
        <div class="trending-carousel__track">
          <!-- Товари будуть додані динамічно через JavaScript -->
        </div>
      </div>

      <button
        class="trending-carousel__nav trending-carousel__nav--next"
        type="button"
        aria-label="Next products"
      >
        <svg
          class="trending-carousel__nav-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </button>
    </div>
  </div>
</section>
