<section class="trending">
  <div class="trending__container">
    <header class="trending__header">
      <h2 class="trending__title">Trending Products</h2>
      <div class="trending__icon">
        <svg
          class="trending__bone-icon"
          width="209"
          height="90"
          viewBox="0 0 209 90"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </div>
      <p class="trending__subtitle">
        Top-selling items and popular picks by our customers. Check them now!
      </p>
    </header>

    <div class="trending__carousel-wrapper">
      <button
        class="trending__nav trending__nav--prev"
        type="button"
        aria-label="Previous products"
      >
        <svg
          class="trending__nav-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </button>

      <div class="trending__carousel">
        <div class="trending__track">
          <article class="trending__item">
            <div class="trending__item-image-wrapper">
              <img
                class="trending__item-image"
                src="assets/img/trending_carousel/aga_rope_toy.png"
                alt="AGA Rope Toy"
              />
            </div>
            <h3 class="trending__item-title">AGA Rope Toy</h3>
            <p class="trending__item-price">$5,00</p>
            <button class="trending__item-button" type="button">
              Add to Cart
            </button>
          </article>

          <article class="trending__item">
            <div class="trending__item-image-wrapper">
              <img
                class="trending__item-image"
                src="assets/img/trending_carousel/dora_pet_carrier.png"
                alt="DORA Pet Carrier"
              />
            </div>
            <h3 class="trending__item-title">DORA Pet Carrier</h3>
            <p class="trending__item-price">$23,00</p>
            <button class="trending__item-button" type="button">
              Add to Cart
            </button>
          </article>

          <article class="trending__item">
            <div class="trending__item-image-wrapper">
              <img
                class="trending__item-image"
                src="assets/img/trending_carousel/dora_metal_pet_bursh.png"
                alt="DORA Metal Pet Brush"
              />
            </div>
            <h3 class="trending__item-title">DORA Metal Pet Brush</h3>
            <p class="trending__item-price">$15,00</p>
            <button class="trending__item-button" type="button">
              Add to Cart
            </button>
          </article>

          <article class="trending__item">
            <div class="trending__item-image-wrapper">
              <img
                class="trending__item-image"
                src="assets/img/trending_carousel/kittens_haven_set.png"
                alt="Kitten's Heaven Set"
              />
            </div>
            <h3 class="trending__item-title">Kitten's Heaven Set</h3>
            <p class="trending__item-price">$12,00</p>
            <button class="trending__item-button" type="button">
              Add to Cart
            </button>
          </article>
        </div>
      </div>

      <button
        class="trending__nav trending__nav--next"
        type="button"
        aria-label="Next products"
      >
        <svg
          class="trending__nav-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </button>
    </div>
  </div>
</section>
