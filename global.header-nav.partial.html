<script>
  (function() {
    function initMenuToggle() {
      const menuToggle = document.getElementById('header-nav__menu-toggle');
      if (menuToggle && !menuToggle.dataset.listenerAdded) {
        menuToggle.dataset.listenerAdded = 'true';
        menuToggle.addEventListener('change', function() {
          if (this.checked) {
            document.body.classList.add('menu-open');
          } else {
            document.body.classList.remove('menu-open');
          }
        });
      }
    }
    
    initMenuToggle();
    
    if (typeof htmx !== 'undefined') {
      document.body.addEventListener('htmx:afterSwap', initMenuToggle);
    }
  })();
</script>
