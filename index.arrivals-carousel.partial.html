<section class="arrivals-carousel" id="new-arrivals">
  <div class="arrivals-carousel__container">
    <header class="arrivals-carousel__header">
      <h2 class="arrivals-carousel__title">Our New Arrivals</h2>
      <div class="arrivals-carousel__icon">
        <svg
          class="arrivals-carousel__bone-icon"
          width="209"
          height="90"
          viewBox="0 0 209 90"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </div>
      <p class="arrivals-carousel__subtitle">
        We offer affordable and safe toys and accessories for your pets.
      </p>
    </header>

    <div class="arrivals-carousel__carousel-wrapper">
      <button
        class="arrivals-carousel__nav arrivals-carousel__nav--prev"
        type="button"
        aria-label="Previous products"
      >
        <svg
          class="arrivals-carousel__nav-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </button>

      <div class="arrivals-carousel__carousel">
        <div class="arrivals-carousel__track">
        </div>
      </div>

      <button
        class="arrivals-carousel__nav arrivals-carousel__nav--next"
        type="button"
        aria-label="Next products"
      >
        <svg
          class="arrivals-carousel__nav-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        ></svg>
      </button>
    </div>
  </div>
</section>
