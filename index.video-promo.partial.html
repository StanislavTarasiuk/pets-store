<section class="video-promo">
  <div class="video-promo__container">
    <div class="video-promo__video">
      <img
        src="assets/img/video-promo/cat_playing.png"
        alt="Cat playing"
        class="video-promo__video-image"
      />
      <button class="video-promo__play-btn" type="button" aria-label="Play video">
        <svg class="video-promo__play-icon" width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle class="video-promo__play-circle" cx="30" cy="30" r="30"/>
          <path class="video-promo__play-triangle" d="M24 18L24 42L42 30L24 18Z" fill="white"/>
        </svg>
      </button>
    </div>

    <div class="video-promo__promo">
      <img
        src="assets/img/video-promo/snacks.png"
        alt="Pet snacks"
        class="video-promo__promo-image"
      />
      <div class="video-promo__promo-content">
        <p class="video-promo__promo-label">PROMO</p>
        <h2 class="video-promo__promo-title">Best Producers of Food for Dogs</h2>
        <a href="#" class="video-promo__promo-link">
          Discover Now
          <span class="video-promo__arrow">→</span>
        </a>
        <ul class="video-promo__promo-list">
          <li class="video-promo__promo-item">WOOF</li>
          <li class="video-promo__promo-item">Cat Daily</li>
          <li class="video-promo__promo-item">Fish Planet</li>
        </ul>
        <div class="video-promo__products">
          <div class="video-promo__product video-promo__product--can">
            <div class="video-promo__product-label">TURKEY PATE</div>
            <div class="video-promo__product-weight">580G</div>
          </div>
          <div class="video-promo__product video-promo__product--bag">
            <div class="video-promo__product-label">WOOF NATURAL CHICKEN</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
